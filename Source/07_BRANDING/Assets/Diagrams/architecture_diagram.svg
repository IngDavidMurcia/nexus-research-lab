<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgGradient)" rx="16" />

  <!-- Title -->
  <text x="500" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F172A" text-anchor="middle">NEXUS Research Lab — Multi-Window Architecture</text>
  <text x="500" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#64748B" text-anchor="middle">Strict separation of concerns via independent LLM chat windows</text>

  <!-- Connection Lines -->
  <!-- From Director to Specialists -->
  <path d="M 500 240 L 500 300" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />
  
  <path d="M 160 300 L 840 300" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />
  
  <path d="M 160 300 L 160 360" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 330 300 L 330 360" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 500 300 L 500 360" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 670 300 L 670 360" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 840 300 L 840 360" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />

  <!-- Human Researcher -->
  <rect x="400" y="480" width="200" height="80" rx="40" fill="#10B981" filter="url(#shadow)" />
  <text x="500" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Human Researcher</text>
  <text x="500" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Copies YAML Snapshot between windows</text>

  <!-- Arrows to/from Human -->
  <path d="M 400 520 C 200 520 160 460 160 460" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 500 480 L 500 250" fill="none" stroke="#10B981" stroke-width="3" />
  
  <!-- The Director Box -->
  <rect x="350" y="140" width="300" height="100" rx="12" fill="#0F172A" filter="url(#shadow)" />
  <text x="500" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NEXUS Director</text>
  <text x="500" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Window 1 (Always Open)</text>
  <text x="500" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#10B981" text-anchor="middle">Orchestration &amp; State</text>

  <!-- Specialist Boxes -->
  <!-- 1. Research Architect -->
  <rect x="80" y="360" width="160" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
  <rect x="80" y="360" width="160" height="6" fill="#2563EB" />
  <text x="160" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Research</text>
  <text x="160" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Architect</text>
  <text x="160" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Window 2</text>

  <!-- 2. Scientific Writer -->
  <rect x="250" y="360" width="160" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
  <rect x="250" y="360" width="160" height="6" fill="#2563EB" />
  <text x="330" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Scientific</text>
  <text x="330" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Writer</text>
  <text x="330" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Window 3</text>

  <!-- 3. Scientific Reviewer -->
  <rect x="420" y="360" width="160" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
  <rect x="420" y="360" width="160" height="6" fill="#2563EB" />
  <text x="500" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Scientific</text>
  <text x="500" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Reviewer</text>
  <text x="500" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Window 4</text>

  <!-- 4. Publication Spec -->
  <rect x="590" y="360" width="160" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
  <rect x="590" y="360" width="160" height="6" fill="#2563EB" />
  <text x="670" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Publication</text>
  <text x="670" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Specialist</text>
  <text x="670" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Window 5</text>

  <!-- 5. Integrity Auditor -->
  <rect x="760" y="360" width="160" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
  <rect x="760" y="360" width="160" height="6" fill="#2563EB" />
  <text x="840" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Integrity</text>
  <text x="840" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Auditor</text>
  <text x="840" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Window 6</text>

  <!-- Legend -->
  <text x="80" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B" font-style="italic">* Specialists are loaded on-demand in separate windows to prevent hallucination and role-blurring.</text>
</svg>
