<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="350" fill="#FFFFFF" />

  <text x="500" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">NEXUS Research Lab — Project Workflow</text>
  <text x="500" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Driven by YAML Project Snapshots</text>

  <!-- Connecting Line -->
  <line x1="100" y1="180" x2="900" y2="180" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Flow Arrows overlay on the line -->
  <path d="M 230 180 L 250 170 L 250 190 Z" fill="#64748B" />
  <path d="M 430 180 L 450 170 L 450 190 Z" fill="#64748B" />
  <path d="M 630 180 L 650 170 L 650 190 Z" fill="#64748B" />
  <path d="M 830 180 L 850 170 L 850 190 Z" fill="#64748B" />

  <!-- Node 1: Director Start -->
  <circle cx="100" cy="180" r="30" fill="#0F172A" filter="url(#shadow)" />
  <text x="100" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">START</text>
  <text x="100" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">WF-001</text>
  <text x="100" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Planning</text>
  
  <!-- Node 2: Design -->
  <circle cx="300" cy="180" r="25" fill="#2563EB" filter="url(#shadow)" />
  <text x="300" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SPC-01</text>
  <text x="300" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">WF-002</text>
  <text x="300" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Methodology</text>

  <!-- Node 3: Writing -->
  <circle cx="500" cy="180" r="25" fill="#2563EB" filter="url(#shadow)" />
  <text x="500" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SPC-02</text>
  <text x="500" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">WF-003</text>
  <text x="500" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Drafting</text>

  <!-- Node 4: Review -->
  <circle cx="700" cy="180" r="25" fill="#2563EB" filter="url(#shadow)" />
  <text x="700" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SPC-03</text>
  <text x="700" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">WF-004</text>
  <text x="700" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Peer Review</text>

  <!-- Node 5: Success -->
  <circle cx="900" cy="180" r="30" fill="#10B981" filter="url(#shadow)" />
  <text x="900" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">READY</text>
  <text x="900" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">WF-009</text>
  <text x="900" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Publication</text>

  <!-- Return Loops (Revisions) -->
  <path d="M 700 150 C 700 80 500 80 500 150" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 495 145 L 505 155 L 515 145 Z" fill="#EF4444" />
  <text x="600" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#EF4444" text-anchor="middle">Major Revision (WF-005)</text>

  <rect x="350" y="300" width="300" height="30" rx="15" fill="#E2E8F0" />
  <text x="500" y="320" font-family="monospace" font-size="12" fill="#0F172A" text-anchor="middle">Director verifies YAML at every step</text>

</svg>
