<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#64748B" stroke-width="1" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" />
  <rect width="1200" height="400" fill="url(#gridPattern)" />

  <!-- Accent Lines -->
  <line x1="0" y1="395" x2="1200" y2="395" stroke="#2563EB" stroke-width="10" />
  <line x1="0" y1="385" x2="1200" y2="385" stroke="#10B981" stroke-width="2" />

  <!-- Logo Mark (Scaled down version of the logo) -->
  <g transform="translate(100, 100) scale(0.5)">
    <!-- Hexagon Base -->
    <polygon points="200,40 340,120 340,280 200,360 60,280 60,120" fill="none" stroke="#2563EB" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Inner Lines -->
    <line x1="200" y1="40" x2="200" y2="200" stroke="#64748B" stroke-width="6" opacity="0.6" />
    <line x1="60" y1="120" x2="200" y2="200" stroke="#64748B" stroke-width="6" opacity="0.6" />
    <line x1="340" y1="120" x2="200" y2="200" stroke="#64748B" stroke-width="6" opacity="0.6" />
    <line x1="60" y1="280" x2="200" y2="200" stroke="#64748B" stroke-width="6" opacity="0.6" />
    <line x1="340" y1="280" x2="200" y2="200" stroke="#64748B" stroke-width="6" opacity="0.6" />
    <line x1="200" y1="360" x2="200" y2="200" stroke="#64748B" stroke-width="6" opacity="0.6" />
    
    <!-- Central Hub -->
    <circle cx="200" cy="200" r="28" fill="#10B981" />
    <circle cx="200" cy="200" r="12" fill="#FFFFFF" />
    
    <!-- Nodes -->
    <circle cx="200" cy="40" r="16" fill="#FFFFFF" />
    <circle cx="60" cy="120" r="14" fill="#2563EB" />
    <circle cx="340" cy="120" r="14" fill="#2563EB" />
    <circle cx="60" cy="280" r="14" fill="#10B981" />
    <circle cx="340" cy="280" r="14" fill="#10B981" />
    <circle cx="200" cy="360" r="16" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="360" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" letter-spacing="2">NEXUS</text>
  <text x="650" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="300" fill="#E2E8F0" letter-spacing="2">Research Lab</text>
  
  <text x="365" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#10B981" letter-spacing="1">Structured AI-Assisted Scientific Research Framework</text>
  
  <!-- UI Accents -->
  <rect x="365" y="280" width="160" height="36" rx="18" fill="#2563EB" opacity="0.2" />
  <text x="385" y="304" font-family="monospace" font-size="14" font-weight="bold" fill="#2563EB">v1.0.1 STABLE</text>

  <rect x="540" y="280" width="220" height="36" rx="18" fill="#64748B" opacity="0.2" />
  <text x="560" y="304" font-family="monospace" font-size="14" font-weight="bold" fill="#E2E8F0">MULTI-WINDOW ARCHITECTURE</text>
  
</svg>
