<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGradient)" rx="16" />

  <!-- Title -->
  <text x="500" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F172A" text-anchor="middle">NEXUS Research Lab — Multi-Window Architecture</text>
  <text x="500" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#64748B" text-anchor="middle">Strict separation of concerns via independent LLM chat windows</text>

  <!-- Top Layer: Foundations -->
  <path d="M 330 180 L 450 250" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 670 180 L 550 250" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="6 4" />

  <!-- Core Module -->
  <g transform="translate(250, 110) scale(0.15)" filter="url(#shadow)">
    <polygon points="200,40 340,120 340,280 200,360 60,280 60,120" fill="#0F172A" stroke="#2563EB" stroke-width="12" stroke-linejoin="round"/>
    <path d="M 200 80 L 280 120 L 280 240 C 280 290 200 320 200 320 C 200 320 120 290 120 240 L 120 120 Z" fill="none" stroke="#10B981" stroke-width="16" stroke-linejoin="round"/>
    <line x1="160" y1="160" x2="240" y2="160" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <line x1="160" y1="200" x2="240" y2="200" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <line x1="160" y1="240" x2="200" y2="240" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  </g>
  <text x="280" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">CORE Rules</text>
  <text x="280" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Source/01_CORE</text>

  <!-- Shared Knowledge Module -->
  <g transform="translate(690, 110) scale(0.15)" filter="url(#shadow)">
    <polygon points="200,40 340,120 340,280 200,360 60,280 60,120" fill="#E2E8F0" stroke="#64748B" stroke-width="12" stroke-linejoin="round"/>
    <ellipse cx="200" cy="140" rx="70" ry="25" fill="#0F172A" />
    <path d="M 130 140 L 130 190 A 70 25 0 0 0 270 190 L 270 140 A 70 25 0 0 1 130 140 Z" fill="#2563EB" />
    <ellipse cx="200" cy="190" rx="70" ry="25" fill="#0F172A" />
    <path d="M 130 190 L 130 240 A 70 25 0 0 0 270 240 L 270 190 A 70 25 0 0 1 130 190 Z" fill="#10B981" />
    <ellipse cx="200" cy="240" rx="70" ry="25" fill="#0F172A" />
    <path d="M 130 240 L 130 290 A 70 25 0 0 0 270 290 L 270 240 A 70 25 0 0 1 130 240 Z" fill="#64748B" />
  </g>
  <text x="720" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Shared Knowledge</text>
  <text x="720" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Source/04_SHARED_KNOWLEDGE</text>

  <!-- Arrows to/from Human (Rendered Behind) -->
  <path d="M 400 620 C 200 620 160 560 160 560" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 500 580 L 500 340" fill="none" stroke="#10B981" stroke-width="3" />

  <!-- Connection Lines (Director to Specialists) -->
  <path d="M 500 330 L 500 390" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 160 390 L 840 390" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 160 390 L 160 450" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 330 390 L 330 450" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 500 390 L 500 450" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 670 390 L 670 450" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 840 390 L 840 450" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />

  <!-- The Director Box -->
  <rect x="350" y="230" width="300" height="100" rx="12" fill="#0F172A" filter="url(#shadow)" />
  <g transform="translate(360, 240) scale(0.2)">
    <polygon points="200,40 340,120 340,280 200,360 60,280 60,120" fill="#0F172A" stroke="#10B981" stroke-width="12" stroke-linejoin="round"/>
    <circle cx="200" cy="200" r="40" fill="#2563EB" />
    <circle cx="200" cy="200" r="16" fill="#FFFFFF" />
  </g>
  <text x="520" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NEXUS Director</text>
  <text x="520" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Window 1 (Always Open)</text>
  <text x="520" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#10B981" text-anchor="middle">Orchestration &amp; State</text>

  <!-- Specialist Boxes -->
  <g transform="translate(0, 90)">
    <!-- 1. Research Architect -->
    <rect x="80" y="360" width="160" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
    <rect x="80" y="360" width="160" height="6" fill="#2563EB" />
    <g transform="translate(130, 370) scale(0.125)">
      <polygon points="200,40 340,120 340,280 200,360 60,280 60,120" fill="#2563EB" stroke="#0F172A" stroke-width="12" stroke-linejoin="round"/>
      <circle cx="200" cy="200" r="70" fill="none" stroke="#FFFFFF" stroke-width="20" />
      <circle cx="200" cy="200" r="24" fill="#10B981" />
    </g>
    <text x="160" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Research Architect</text>
    <text x="160" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Window 2</text>

    <!-- 2. Scientific Writer -->
    <rect x="250" y="360" width="160" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
    <rect x="250" y="360" width="160" height="6" fill="#2563EB" />
    <g transform="translate(300, 370) scale(0.125)">
      <polygon points="200,40 340,120 340,280 200,360 60,280 60,120" fill="#2563EB" stroke="#0F172A" stroke-width="12" stroke-linejoin="round"/>
      <circle cx="200" cy="200" r="70" fill="none" stroke="#FFFFFF" stroke-width="20" />
      <circle cx="200" cy="200" r="24" fill="#10B981" />
    </g>
    <text x="330" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Scientific Writer</text>
    <text x="330" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Window 3</text>

    <!-- 3. Scientific Reviewer -->
    <rect x="420" y="360" width="160" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
    <rect x="420" y="360" width="160" height="6" fill="#2563EB" />
    <g transform="translate(470, 370) scale(0.125)">
      <polygon points="200,40 340,120 340,280 200,360 60,280 60,120" fill="#2563EB" stroke="#0F172A" stroke-width="12" stroke-linejoin="round"/>
      <circle cx="200" cy="200" r="70" fill="none" stroke="#FFFFFF" stroke-width="20" />
      <circle cx="200" cy="200" r="24" fill="#10B981" />
    </g>
    <text x="500" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Scientific Reviewer</text>
    <text x="500" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Window 4</text>

    <!-- 4. Publication Spec -->
    <rect x="590" y="360" width="160" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
    <rect x="590" y="360" width="160" height="6" fill="#2563EB" />
    <g transform="translate(640, 370) scale(0.125)">
      <polygon points="200,40 340,120 340,280 200,360 60,280 60,120" fill="#2563EB" stroke="#0F172A" stroke-width="12" stroke-linejoin="round"/>
      <circle cx="200" cy="200" r="70" fill="none" stroke="#FFFFFF" stroke-width="20" />
      <circle cx="200" cy="200" r="24" fill="#10B981" />
    </g>
    <text x="670" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Publication Spec.</text>
    <text x="670" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Window 5</text>

    <!-- 5. Integrity Auditor -->
    <rect x="760" y="360" width="160" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
    <rect x="760" y="360" width="160" height="6" fill="#2563EB" />
    <g transform="translate(810, 370) scale(0.125)">
      <polygon points="200,40 340,120 340,280 200,360 60,280 60,120" fill="#2563EB" stroke="#0F172A" stroke-width="12" stroke-linejoin="round"/>
      <circle cx="200" cy="200" r="70" fill="none" stroke="#FFFFFF" stroke-width="20" />
      <circle cx="200" cy="200" r="24" fill="#10B981" />
    </g>
    <text x="840" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Integrity Auditor</text>
    <text x="840" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Window 6</text>
  </g>

  <!-- Human Researcher -->
  <rect x="400" y="580" width="200" height="80" rx="40" fill="#10B981" filter="url(#shadow)" />
  <text x="500" y="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Human Researcher</text>
  <text x="500" y="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Copies YAML Snapshot</text>
  <text x="500" y="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">between windows</text>

  <!-- Arrows to/from Human (Moved up for Z-Index) -->
  
  <!-- Legend -->
  <text x="80" y="670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B" font-style="italic">* Specialists are loaded on-demand in separate windows to prevent hallucination and role-blurring. You don't necessarily have to have six windows open.</text>
</svg>
