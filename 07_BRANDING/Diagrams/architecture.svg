<svg viewBox="0 0 800 980" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#12263F"/>
    </marker>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#12263F"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="180" y="8" width="440" height="34" rx="6" fill="#0B1F3A"/>
  <text x="400" y="30" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="1">1. ARCHITECTURE DIAGRAM</text>

  <!-- CORE -->
  <rect x="60" y="60" width="680" height="110" rx="10" fill="#EAFBF1" stroke="#86EFAC" stroke-width="1.5"/>
  <circle cx="100" cy="95" r="12" fill="#16A34A"/>
  <text x="100" y="100" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text>
  <text x="125" y="100" fill="#0B1F3A" font-size="18" font-weight="700">CORE</text>
  <text x="125" y="125" fill="#334155" font-size="13">Foundation, governance and standards that</text>
  <text x="125" y="143" fill="#334155" font-size="13">sustain the entire framework.</text>
  <!-- temple icon -->
  <g transform="translate(670,90)" stroke="#0B1F3A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,10 L20,-4 L40,10"/>
    <rect x="2" y="12" width="36" height="4"/>
    <line x1="6" y1="16" x2="6" y2="30"/>
    <line x1="14" y1="16" x2="14" y2="30"/>
    <line x1="22" y1="16" x2="22" y2="30"/>
    <line x1="30" y1="16" x2="30" y2="30"/>
    <rect x="0" y="30" width="40" height="4"/>
  </g>

  <line x1="400" y1="170" x2="400" y2="204" stroke="#0B1F3A" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrowDown)"/>

  <!-- DIRECTOR -->
  <rect x="60" y="204" width="680" height="110" rx="10" fill="#EAFBF1" stroke="#86EFAC" stroke-width="1.5"/>
  <circle cx="100" cy="239" r="12" fill="#16A34A"/>
  <text x="100" y="244" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text>
  <text x="125" y="244" fill="#0B1F3A" font-size="18" font-weight="700">DIRECTOR</text>
  <text x="125" y="269" fill="#334155" font-size="13">Orchestrates the research lifecycle,</text>
  <text x="125" y="287" fill="#334155" font-size="13">ensuring methodological integrity.</text>
  <!-- target icon -->
  <g transform="translate(690,259)" stroke="#0B1F3A" stroke-width="2.2" fill="none">
    <circle r="18"/>
    <circle r="10"/>
    <circle r="2.5" fill="#0B1F3A"/>
  </g>

  <line x1="400" y1="314" x2="400" y2="348" stroke="#0B1F3A" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrowDown)"/>

  <!-- SPECIALISTS -->
  <rect x="60" y="348" width="680" height="110" rx="10" fill="#EAF2FE" stroke="#93C5FD" stroke-width="1.5"/>
  <circle cx="100" cy="383" r="12" fill="#2563EB"/>
  <text x="100" y="388" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text>
  <text x="125" y="388" fill="#0B1F3A" font-size="18" font-weight="700">SPECIALISTS</text>
  <text x="125" y="413" fill="#334155" font-size="13">Domain experts and AI agents that execute</text>
  <text x="125" y="431" fill="#334155" font-size="13">specialized tasks and generate high-quality outputs.</text>
  <!-- people icon -->
  <g transform="translate(660,403)" stroke="#0B1F3A" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="8"/>
    <path d="M-10,20 C-10,8 10,8 10,20"/>
    <circle cx="-26" cy="6" r="6"/>
    <path d="M-34,20 C-34,12 -18,12 -18,20"/>
    <circle cx="26" cy="6" r="6"/>
    <path d="M18,20 C18,12 34,12 34,20"/>
  </g>

  <!-- branch to three boxes -->
  <line x1="400" y1="458" x2="400" y2="480" stroke="#0B1F3A" stroke-width="2"/>
  <line x1="165" y1="480" x2="635" y2="480" stroke="#0B1F3A" stroke-width="2"/>
  <line x1="165" y1="480" x2="165" y2="500" stroke="#0B1F3A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="480" x2="400" y2="500" stroke="#0B1F3A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="635" y1="480" x2="635" y2="500" stroke="#0B1F3A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SHARED KNOWLEDGE -->
  <rect x="60" y="500" width="212" height="160" rx="10" fill="#FEF9E7" stroke="#FDE68A" stroke-width="1.5"/>
  <circle cx="100" cy="530" r="12" fill="#CA8A04"/>
  <text x="100" y="535" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text>
  <text x="125" y="527" fill="#0B1F3A" font-size="15" font-weight="700">SHARED</text>
  <text x="125" y="545" fill="#0B1F3A" font-size="15" font-weight="700">KNOWLEDGE</text>
  <text x="80" y="575" fill="#334155" font-size="12">Centralized scientific</text>
  <text x="80" y="592" fill="#334155" font-size="12">knowledge base that stores,</text>
  <text x="80" y="609" fill="#334155" font-size="12">organizes and connects</text>
  <text x="80" y="626" fill="#334155" font-size="12">information.</text>
  <g transform="translate(85,635)" stroke="#0B1F3A" stroke-width="2" fill="none" stroke-linejoin="round">
    <path d="M0,0 L14,-6 L28,0 L14,6 Z"/>
    <path d="M0,8 L14,2 L28,8 L14,14 Z"/>
  </g>

  <!-- TEMPLATES -->
  <rect x="294" y="500" width="212" height="160" rx="10" fill="#F3EEFB" stroke="#D8B4FE" stroke-width="1.5"/>
  <circle cx="334" cy="530" r="12" fill="#9333EA"/>
  <text x="334" y="535" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text>
  <text x="359" y="536" fill="#0B1F3A" font-size="15" font-weight="700">TEMPLATES</text>
  <text x="314" y="565" fill="#334155" font-size="12">Standardized research</text>
  <text x="314" y="582" fill="#334155" font-size="12">documents that ensure</text>
  <text x="314" y="599" fill="#334155" font-size="12">consistency, quality and</text>
  <text x="314" y="616" fill="#334155" font-size="12">reproducibility.</text>
  <g transform="translate(320,630)" stroke="#0B1F3A" stroke-width="2" fill="none" stroke-linecap="round">
    <rect x="0" y="0" width="24" height="30" rx="2"/>
    <line x1="5" y1="8" x2="19" y2="8"/>
    <line x1="5" y1="14" x2="19" y2="14"/>
    <line x1="5" y1="20" x2="14" y2="20"/>
  </g>

  <!-- EXAMPLES -->
  <rect x="528" y="500" width="212" height="160" rx="10" fill="#E8FBFC" stroke="#A5F3FC" stroke-width="1.5"/>
  <circle cx="568" cy="530" r="12" fill="#0891B2"/>
  <text x="568" y="535" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text>
  <text x="593" y="536" fill="#0B1F3A" font-size="15" font-weight="700">EXAMPLES</text>
  <text x="548" y="565" fill="#334155" font-size="12">Reference implementations</text>
  <text x="548" y="582" fill="#334155" font-size="12">and use cases that</text>
  <text x="548" y="599" fill="#334155" font-size="12">demonstrate the practical</text>
  <text x="548" y="616" fill="#334155" font-size="12">application of the framework.</text>
  <g transform="translate(556,655)" stroke="#0B1F3A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="15" x2="0" y2="0"/>
    <line x1="0" y1="15" x2="30" y2="15"/>
    <rect x="3" y="6" width="5" height="9" fill="#0B1F3A" stroke="none"/>
    <rect x="11" y="2" width="5" height="13" fill="#0B1F3A" stroke="none"/>
    <rect x="19" y="9" width="5" height="6" fill="#0B1F3A" stroke="none"/>
    <path d="M2,-2 L18,-10 L26,-4" stroke="#0B1F3A"/>
    <path d="M18,-10 L18,-6 M18,-10 L22,-9" stroke="#0B1F3A"/>
  </g>

  <!-- dashed connectors to outcomes -->
  <line x1="166" y1="660" x2="166" y2="680" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="400" y1="660" x2="400" y2="680" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="634" y1="660" x2="634" y2="680" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="166" y1="680" x2="634" y2="680" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="400" y1="680" x2="400" y2="700" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- OUTCOMES -->
  <rect x="60" y="700" width="680" height="240" rx="10" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="400" y="732" text-anchor="middle" fill="#0B1F3A" font-size="15" font-weight="700" letter-spacing="1">OUTCOMES</text>

  <g font-size="12" fill="#334155">
    <g transform="translate(105,780)">
      <g stroke="#0B1F3A" stroke-width="2" fill="none"><path d="M-14,10 L0,0 L14,10 M-14,10 L-14,24 M14,10 L14,24 M-14,24 L14,24"/></g>
      <text x="0" y="55" text-anchor="middle">Scientific</text>
      <text x="0" y="70" text-anchor="middle">Knowledge</text>
    </g>
    <g transform="translate(240,780)">
      <g stroke="#0B1F3A" stroke-width="2" fill="none"><rect x="-14" y="-2" width="28" height="24" rx="2"/><path d="M-8,4 h16 M-8,10 h16 M-8,16 h10" /></g>
      <text x="0" y="55" text-anchor="middle">High-Quality</text>
      <text x="0" y="70" text-anchor="middle">Outputs</text>
    </g>
    <g transform="translate(400,780)">
      <g stroke="#0B1F3A" stroke-width="2" fill="none"><circle r="14"/><path d="M-5,0 L-1,5 L6,-6"/></g>
      <text x="0" y="55" text-anchor="middle">Reproducible</text>
      <text x="0" y="70" text-anchor="middle">Research</text>
    </g>
    <g transform="translate(560,780)">
      <g stroke="#0B1F3A" stroke-width="2" fill="none">
        <circle cx="-8" cy="-4" r="6"/><path d="M-16,12 C-16,4 0,4 0,12"/>
        <circle cx="8" cy="-4" r="6"/><path d="M0,12 C0,4 16,4 16,12"/>
      </g>
      <text x="0" y="55" text-anchor="middle">Collaborative</text>
      <text x="0" y="70" text-anchor="middle">Ecosystem</text>
    </g>
    <g transform="translate(695,780)">
      <g stroke="#0B1F3A" stroke-width="2" fill="none"><circle r="14"/><ellipse rx="14" ry="6"/><line x1="0" y1="-14" x2="0" y2="14"/></g>
      <text x="0" y="55" text-anchor="middle">Real-World</text>
      <text x="0" y="70" text-anchor="middle">Impact</text>
    </g>
  </g>
</svg>
