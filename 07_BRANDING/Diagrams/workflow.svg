<svg viewBox="0 0 940 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#0B1F3A"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="230" y="8" width="480" height="34" rx="6" fill="#0B1F3A"/>
  <text x="470" y="30" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="1">2. RESEARCH LIFECYCLE FLOW DIAGRAM</text>

  <!-- connecting arcs (clockwise) -->
  <g fill="none" stroke="#0B1F3A" stroke-width="2">
    <path d="M 475,175 A 250,250 0 0 1 685,300" marker-end="url(#arr)"/>
    <path d="M 685,300 A 250,250 0 0 1 685,460" marker-end="url(#arr)"/>
    <path d="M 685,460 A 250,250 0 0 1 475,585" marker-end="url(#arr)"/>
    <path d="M 475,585 A 250,250 0 0 1 265,460" marker-end="url(#arr)"/>
    <path d="M 265,460 A 250,250 0 0 1 265,300" marker-end="url(#arr)"/>
    <path d="M 265,300 A 250,250 0 0 1 475,175" marker-end="url(#arr)"/>
  </g>

  <!-- center hub -->
  <circle cx="470" cy="380" r="70" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  <g transform="translate(470,355)" stroke="#16A34A" stroke-width="2" fill="none" stroke-linejoin="round">
    <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10"/>
    <circle r="4" fill="#16A34A" stroke="none"/>
    <line x1="0" y1="0" x2="0" y2="-20"/>
    <line x1="0" y1="0" x2="17" y2="-10"/>
    <line x1="0" y1="0" x2="17" y2="10"/>
    <line x1="0" y1="0" x2="0" y2="20"/>
    <line x1="0" y1="0" x2="-17" y2="10"/>
    <line x1="0" y1="0" x2="-17" y2="-10"/>
  </g>
  <text x="470" y="405" text-anchor="middle" fill="#0B1F3A" font-size="14" font-weight="700" letter-spacing="1">NEXUS</text>
  <text x="470" y="420" text-anchor="middle" fill="#0B1F3A" font-size="10" letter-spacing="1">FRAMEWORK</text>

  <!-- node template macro replaced manually for each -->

  <!-- 1 DEFINE (top) -->
  <circle cx="470" cy="140" r="46" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <g transform="translate(470,140)" stroke="#0B1F3A" stroke-width="2" fill="none"><circle r="16"/><circle r="9"/><circle r="2" fill="#0B1F3A"/></g>
  <circle cx="416" cy="112" r="9" fill="#16A34A"/>
  <text x="416" y="116" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">1</text>
  <text x="432" y="116" fill="#0B1F3A" font-size="14" font-weight="700">DEFINE</text>
  <text x="560" y="108" fill="#334155" font-size="11">Define the research problem,</text>
  <text x="560" y="123" fill="#334155" font-size="11">objectives, scope and</text>
  <text x="560" y="138" fill="#334155" font-size="11">success criteria.</text>

  <!-- 2 PLAN (upper right) -->
  <circle cx="695" cy="270" r="46" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <g transform="translate(695,270)" stroke="#0B1F3A" stroke-width="2" fill="none"><rect x="-13" y="-15" width="26" height="30" rx="2"/><path d="M-6,-15 h12 v-4 h-12 z" fill="#0B1F3A"/><path d="M-6,-4 l4,4 l8,-9" /></g>
  <circle cx="695" cy="216" r="9" fill="#16A34A"/>
  <text x="695" y="220" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">2</text>
  <text x="711" y="220" fill="#0B1F3A" font-size="14" font-weight="700">PLAN</text>
  <text x="770" y="252" fill="#334155" font-size="11">Design the research</text>
  <text x="770" y="267" fill="#334155" font-size="11">strategy, methodology,</text>
  <text x="770" y="282" fill="#334155" font-size="11">resources and timeline.</text>

  <!-- 3 EXECUTE (lower right) -->
  <circle cx="695" cy="490" r="46" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <g transform="translate(695,494)" stroke="#0B1F3A" stroke-width="2" fill="none">
    <circle cx="0" cy="-14" r="7"/><path d="M-12,8 C-12,-2 12,-2 12,8"/>
    <circle cx="-20" cy="-8" r="5"/><path d="M-28,6 C-28,0 -16,0 -16,6"/>
    <circle cx="20" cy="-8" r="5"/><path d="M16,6 C16,0 28,0 28,6"/>
  </g>
  <circle cx="695" cy="446" r="9" fill="#16A34A"/>
  <text x="695" y="450" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">3</text>
  <text x="711" y="450" fill="#0B1F3A" font-size="14" font-weight="700">EXECUTE</text>
  <text x="770" y="482" fill="#334155" font-size="11">Specialists and AI</text>
  <text x="770" y="497" fill="#334155" font-size="11">agents execute tasks</text>
  <text x="770" y="512" fill="#334155" font-size="11">and generate data and results.</text>

  <!-- 4 ANALYZE (bottom) -->
  <circle cx="470" cy="620" r="46" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <g transform="translate(470,624)" stroke="#0B1F3A" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M-14,10 v-6 M-4,10 v-14 M6,10 v-8 M16,10 v-18"/>
    <path d="M-16,-10 l8,6 l6,-10 l10,4" stroke-linejoin="round"/>
  </g>
  <circle cx="470" cy="666" r="9" fill="#16A34A"/>
  <text x="470" y="670" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">4</text>
  <text x="486" y="670" fill="#0B1F3A" font-size="14" font-weight="700">ANALYZE</text>
  <text x="470" y="700" text-anchor="middle" fill="#334155" font-size="11">Analyze results, validate findings</text>
  <text x="470" y="715" text-anchor="middle" fill="#334155" font-size="11">and generate insights.</text>

  <!-- 5 DOCUMENT (lower left) -->
  <circle cx="245" cy="490" r="46" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <g transform="translate(245,490)" stroke="#0B1F3A" stroke-width="2" fill="none" stroke-linecap="round"><rect x="-13" y="-16" width="26" height="32" rx="2"/><line x1="-7" y1="-6" x2="7" y2="-6"/><line x1="-7" y1="0" x2="7" y2="0"/><line x1="-7" y1="6" x2="2" y2="6"/></g>
  <circle cx="185" cy="446" r="9" fill="#16A34A"/>
  <text x="185" y="450" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">5</text>
  <text x="120" y="450" fill="#0B1F3A" font-size="14" font-weight="700">DOCUMENT</text>
  <text x="90" y="482" fill="#334155" font-size="11">Document the process,</text>
  <text x="90" y="497" fill="#334155" font-size="11">results and decisions</text>
  <text x="90" y="512" fill="#334155" font-size="11">using standardized templates.</text>

  <!-- 6 PUBLISH (upper left) -->
  <circle cx="245" cy="270" r="46" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <g transform="translate(245,270)" stroke="#0B1F3A" stroke-width="2" fill="none" stroke-linejoin="round"><path d="M0,-14 C-14,-20 -22,-14 -22,-6 C-22,4 -10,10 0,16 C10,10 22,4 22,-6 C22,-14 14,-20 0,-14 Z"/><line x1="0" y1="-14" x2="0" y2="16"/></g>
  <circle cx="185" cy="216" r="9" fill="#16A34A"/>
  <text x="185" y="220" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">6</text>
  <text x="118" y="220" fill="#0B1F3A" font-size="14" font-weight="700">PUBLISH</text>
  <text x="90" y="252" fill="#334155" font-size="11">Share outputs,</text>
  <text x="90" y="267" fill="#334155" font-size="11">knowledge and</text>
  <text x="90" y="282" fill="#334155" font-size="11">publications to</text>
  <text x="90" y="297" fill="#334155" font-size="11">generate impact.</text>

  <!-- Modules panel -->
  <rect x="60" y="740" width="820" height="140" rx="10" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="470" y="770" text-anchor="middle" fill="#0B1F3A" font-size="14" font-weight="700" letter-spacing="1">ENABLED BY THE SIX CORE MODULES</text>

  <g font-size="12" font-weight="700" fill="#0B1F3A">
    <!-- CORE -->
    <g transform="translate(150,825)">
      <g stroke="#16A34A" stroke-width="2" fill="none"><polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8"/><circle r="3" fill="#16A34A" stroke="none"/></g>
      <text x="0" y="42" text-anchor="middle">CORE</text>
    </g>
    <!-- DIRECTOR -->
    <g transform="translate(300,825)">
      <g stroke="#16A34A" stroke-width="2" fill="none"><circle r="16"/><circle r="9"/><circle r="2" fill="#16A34A"/></g>
      <text x="0" y="42" text-anchor="middle">DIRECTOR</text>
    </g>
    <!-- SPECIALISTS -->
    <g transform="translate(450,825)">
      <g stroke="#16A34A" stroke-width="2" fill="none">
        <circle cx="0" cy="-8" r="6"/><path d="M-9,10 C-9,2 9,2 9,10"/>
        <circle cx="-18" cy="-4" r="5"/><path d="M-25,10 C-25,4 -13,4 -13,10"/>
        <circle cx="18" cy="-4" r="5"/><path d="M13,10 C13,4 25,4 25,10"/>
      </g>
      <text x="0" y="42" text-anchor="middle">SPECIALISTS</text>
    </g>
    <!-- SHARED KNOWLEDGE -->
    <g transform="translate(600,825)">
      <g stroke="#16A34A" stroke-width="2" fill="none" stroke-linejoin="round"><path d="M0,-14 L14,-6 L0,2 L-14,-6 Z"/><path d="M0,-2 L14,6 L0,14 L-14,6 Z"/></g>
      <text x="0" y="42" text-anchor="middle" font-size="11">SHARED</text>
      <text x="0" y="56" text-anchor="middle" font-size="11">KNOWLEDGE</text>
    </g>
    <!-- TEMPLATES -->
    <g transform="translate(750,825)">
      <g stroke="#16A34A" stroke-width="2" fill="none" stroke-linecap="round"><rect x="-12" y="-16" width="24" height="30" rx="2"/><line x1="-6" y1="-8" x2="6" y2="-8"/><line x1="-6" y1="-2" x2="6" y2="-2"/><line x1="-6" y1="4" x2="2" y2="4"/></g>
      <text x="0" y="42" text-anchor="middle">TEMPLATES</text>
    </g>
    <!-- EXAMPLES -->
    <g transform="translate(830,825)">
      <g stroke="#16A34A" stroke-width="2" fill="none" stroke-linecap="round">
        <line x1="-14" y1="14" x2="-14" y2="-2"/>
        <line x1="-14" y1="14" x2="16" y2="14"/>
        <rect x="-10" y="4" width="5" height="10" fill="#16A34A" stroke="none"/>
        <rect x="-1" y="-6" width="5" height="20" fill="#16A34A" stroke="none"/>
        <rect x="8" y="0" width="5" height="14" fill="#16A34A" stroke="none"/>
      </g>
      <text x="0" y="42" text-anchor="middle">EXAMPLES</text>
    </g>
  </g>
</svg>
